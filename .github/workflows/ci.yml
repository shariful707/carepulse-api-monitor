name: Verify CarePulse
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4 # Fetch only the repository source.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci # Install exactly the locked runtime and development dependencies.
      - run: npm run check
      - run: npm run format:check
      - run: npm test # Unit, persistence, email, concurrency and local SMTP tests.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser # Desktop/mobile flows plus automated accessibility checks.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7
